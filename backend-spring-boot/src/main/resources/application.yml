server:
  port: 8080

spring:
  application:
    name: viplike-radiant-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:autopost_saas}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:26082003}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ViplikeHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

jwt:
  secret: ViplikeRadiantSecretKeyForJwtAuthentication2026SuperSecureKeyWithMin256Bits
  expirationMs: 864000000 # 10 days

logging:
  level:
    root: INFO
    com.viplike.radiant: DEBUG
    org.springframework.security: WARN
