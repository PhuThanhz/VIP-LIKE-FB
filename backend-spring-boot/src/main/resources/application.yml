server:
  port: 8080

spring:
  application:
    name: viplike-radiant-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:autopost_saas}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:26082003}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ViplikeRadiantSecretKeyForJwtAuthentication2026SuperSecureKeyWithMin256Bits
  expirationMs: 864000000 # 10 ngày

logging:
  level:
    root: INFO
    com.viplike.radiant: DEBUG
    org.springframework.security: WARN
