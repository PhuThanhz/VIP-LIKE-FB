name: Build Desktop App (.exe & .dmg)

# Every push to main → build Windows + macOS → create a GitHub Release
# (installed apps auto-update via latest.json) → overwrite the installers on Google Drive.
on:
  workflow_dispatch:
  push:
    branches: [main, feat/ui-auth-license-hardening]
    paths-ignore:
      - '**/*.md'
      - '_backup_*/**'
      - 'backups/**'
      - 'backend/data/**'
      - 'backend/browser_profiles/**'
      - 'scripts/**'
      - 'database_schema.sql'
      - '*.txt'

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './frontend/src-tauri -> target'

      - name: Set app version
        shell: bash
        run: |
          node -e "const f='frontend/src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.version=process.env.APP_VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2));"
          echo "Building version $APP_VERSION"

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          npm ci || npm install

      - name: Bundle Node backend into the app
        shell: bash
        run: node scripts/prepare-backend-bundle.mjs

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: './frontend'
          tagName: app-v__VERSION__
          releaseName: 'VIPLIKE RADIANT v__VERSION__'
          releaseBody: 'Automatic update from commit ${{ github.sha }}'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json

  upload-drive:
    needs: [version, build-tauri]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
    steps:
      - name: Skip if Drive not configured
        id: chk
        run: |
          if [ -z "$RCLONE_CONFIG_DATA" ]; then
            echo "RCLONE_CONFIG secret not set → skipping Drive upload"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installers from release
        if: steps.chk.outputs.ok == 'true'
        run: |
          mkdir dl && cd dl
          gh release download "app-v$VERSION" -R "$GITHUB_REPOSITORY" -p '*-setup.exe' -p '*.dmg'
          ls -la

      - name: Upload to Google Drive (overwrite)
        if: steps.chk.outputs.ok == 'true'
        env:
          WIN_FOLDER: ${{ secrets.DRIVE_WINDOWS_FOLDER_ID || '1mlj1duuTbpNqg2l8Dp7N7ZUtOuAFY_8L' }}
          MAC_FOLDER: ${{ secrets.DRIVE_MAC_FOLDER_ID || '1mlj1duuTbpNqg2l8Dp7N7ZUtOuAFY_8L' }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          EXE=$(ls dl/*-setup.exe 2>/dev/null | head -1 || true)
          DMG=$(ls dl/*.dmg 2>/dev/null | head -1 || true)
          
          if [ -n "$WIN_FOLDER" ] && [ -n "$EXE" ] && [ -f "$EXE" ]; then
            echo "Uploading Windows installer..."
            rclone copyto "$EXE" gdrive:Windows/VIPLIKE-RADIANT-Setup.exe --drive-root-folder-id "$WIN_FOLDER" -v
            printf 'Version: %s\nCommit: %s\n' "$VERSION" "$GITHUB_SHA" > version_win.txt
            rclone copyto version_win.txt gdrive:Windows/version-windows.txt --drive-root-folder-id "$WIN_FOLDER"
          fi

          if [ -n "$MAC_FOLDER" ] && [ -n "$DMG" ] && [ -f "$DMG" ]; then
            echo "Uploading macOS installer..."
            rclone copyto "$DMG" gdrive:MacBook/VIPLIKE-RADIANT.dmg --drive-root-folder-id "$MAC_FOLDER" -v
            printf 'Version: %s\nCommit: %s\n' "$VERSION" "$GITHUB_SHA" > version_mac.txt
            rclone copyto version_mac.txt gdrive:MacBook/version-mac.txt --drive-root-folder-id "$MAC_FOLDER"
          fi
