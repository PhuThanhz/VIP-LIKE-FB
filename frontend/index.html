<!doctype html>
<html lang="en" class="dark notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Stop browser auto-translate: re-translating the live progress view every second makes the app lag -->
    <meta name="google" content="notranslate" />
    <script>
      try {
        localStorage.setItem('viplike-theme', 'dark');
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>VIP LIKE RADIANT - Facebook Engagement & Like Buff System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-app text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-on-accent">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
